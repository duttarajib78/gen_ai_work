[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "admissions-audit-agent"
version = "1.0.0"
description = "LLM-assisted clinical-coding support review served from a SageMaker real-time endpoint"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.43,<2",
  "defusedxml>=0.7.1,<0.8",
  "Flask>=3.0,<4",
  "gunicorn>=23.0,<25",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10", "PyYAML>=6.0", "pip-tools>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"tools/*" = ["S603", "S607"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
