# Stage 1: contrastive pre-training of the encoder. Values equal the prototype's hyper-parameters.
# Unknown keys are rejected, so typos fail loudly. Override from the CLI with --pretrain-set key=value.
encoder:
  hidden_size: 256
  num_hidden_layers: 6
  num_attention_heads: 8
  intermediate_size: 1024
  attention_probs_dropout_prob: 0.20
  hidden_dropout_prob: 0.20
  position_embedding_type: relative_key_query
  max_position_embeddings: 512
  type_vocab_size: 2
  layer_norm_eps: 1.0e-12
  hidden_act: gelu
  initializer_range: 0.02

tokenization:               # stored in the model bundle; serving always matches training
  max_len: 128
  sort_medical_claims: true
  keep_sep_on_truncation: true
  name: standard-v1

min_code_frequency: 10      # codes seen fewer times become [UNK]
val_fraction: 0.10          # hash-split on admission_no, stable across stages
batch_size: 64
eval_batch_size: 128
epochs: 100
learning_rate: 1.0e-5
weight_decay: 0.01
warmup_ratio: 0.10
temperature: 0.30
mask_probability: 0.15
grad_clip_norm: 1.0
early_stopping_patience: 10
uniformity_sample_size: 5000

runtime:
  seed: 42
  require_gpu: true         # refuse to train on CPU
  amp: true
  num_workers: 4
  checkpoint_dir: null      # e.g. /opt/ml/checkpoints on SageMaker for spot-safe resume
