[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drg-audit"
version = "1.0.0"
description = "AR-DRG billing anomaly detection: contrastive transformer encoder plus cascaded classifier, served from a SageMaker real-time endpoint"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
serve = ["torch>=2.1", "transformers==4.46.3", "safetensors==0.4.5"]
train = ["drg-audit[serve]", "pandas>=2.1", "pyarrow>=15", "scikit-learn>=1.3", "PyYAML>=6.0"]
ops = ["boto3>=1.34", "PyYAML>=6.0"]
dev = ["drg-audit[train,ops]", "openpyxl>=3.1", "pytest>=8", "ruff>=0.5", "pip-tools>=7.4"]

[project.scripts]
drg-audit = "drg_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "sagemaker", "sagemaker/code"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "S"]   # pycodestyle, pyflakes, bugbear, bandit-style security checks
ignore = ["E501", "S101", "B905", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108", "S603", "B011"]
"sagemaker/*" = ["S603", "S607"]
"scripts/*" = ["S603", "S607"]
